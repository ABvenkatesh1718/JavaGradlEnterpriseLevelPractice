spring:
  application:
    name: EnterpriseLevelPractice
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  config:
    import:
      - "optional:file:${EXT_CONFIG_DIR:P:/Java/SpringBoot/KeySecrets}/db-secret.yaml"
#  liquidbase:
#    enabled: true
#    change-log: classpath:db/changelog/db.changelog-master.yaml

# Sensible fallbacks if the external file is absent
boot:
  datasource:
    driver-class-name: org.postgresql.Driver
  hikari:
    pool-name: EnterpriseHikariCP
    maximum-pool-size: 4
    minimum-idle: 2